spring:
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/agrolink_dev}
      auto-index-creation: true
  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZE:5MB}
      max-request-size: ${MAX_REQUEST_SIZE:5MB}

server:
  port: ${SERVER_PORT:8080}

agrolink:
  jwt:
    secret: ${JWT_SECRET:agrolink-dev-only-signing-key-please-override-in-prod}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:4200,http://localhost:8080}
  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME:nxsbcchx}
    api-key: ${CLOUDINARY_API_KEY:643727394488173}
    api-secret: ${CLOUDINARY_API_SECRET:ADi4BP1ZmQt1c1ovQnVJ0vaCKSk}
    avatar-folder: ${CLOUDINARY_AVATAR_FOLDER:agrolink/avatars}
    produce-folder: ${CLOUDINARY_PRODUCE_FOLDER:agrolink/produce}

logging:
  level:
    com.agrolink.app: DEBUG
