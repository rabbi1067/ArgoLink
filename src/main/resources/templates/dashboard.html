<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgroLink - Dashboard</title>
    <meta name="robots" content="noindex">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link rel="stylesheet" th:href="@{/css/dashboard-pro.css}">
    <link rel="stylesheet" th:href="@{/css/dark-mode.css}">

    <script th:src="@{/js/core/theme.js}"></script>
    <script>
        if (window.Theme) {
            Theme.applyTheme(Theme.getTheme());
        }
    </script>
</head>
<body>

<div class="drawer-overlay" id="drawerOverlay"></div>

<aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
        <span class="icon-box">🌾</span>
        <span>AgroLink</span>
    </div>
    <nav class="sidebar-nav" id="sidebarNav" aria-label="Sidebar"></nav>
    <div class="sidebar-footer">
        <button type="button" class="btn btn-ghost btn-sm w-full" id="logoutBtn">
            <span data-i18n="shell.logout">Logout</span>
        </button>
    </div>
</aside>

<div class="app-shell">
    <div class="app-content">
        <header class="topbar">
            <button type="button" class="btn btn-ghost btn-icon lg:hidden" id="drawerToggle" aria-label="Open menu" data-i18n-aria="shell.openMenu">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="6" x2="20" y2="6"></line><line x1="4" y1="12" x2="20" y2="12"></line><line x1="4" y1="18" x2="20" y2="18"></line></svg>
            </button>

            <div class="topbar-search">
                <input id="globalSearch" class="input" type="search" placeholder="Search produce, orders, users..." aria-label="Global search" data-i18n-ph="shell.searchPh" data-i18n-aria="shell.searchLabel">
            </div>

            <div class="topbar-actions">
                <button type="button" class="lang-toggle" data-lang-toggle aria-label="Switch to Bangla">বাংলা</button>
                <button type="button" class="theme-toggle" data-theme-toggle aria-label="Toggle day/night theme" title="Toggle day/night theme" data-i18n-aria="shell.theme" data-i18n-title="shell.theme">
                    <svg data-theme-icon="moon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
                    <svg data-theme-icon="sun" class="hidden" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32l1.41 1.41M2 12h2m16 0h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path></svg>
                </button>

                <div class="profile-menu" id="profileMenu">
                    <button type="button" class="profile-chip profile-menu-toggle" id="profileMenuToggle" title="Open profile menu" aria-label="Open profile menu" aria-haspopup="true" aria-expanded="false" data-i18n-title="shell.openProfile" data-i18n-aria="shell.openProfile">
                        <span class="profile-avatar avatar-photo" id="profileAvatarWrap">
                            <span id="profileAvatar">?</span>
                            <img id="topbar-avatar" alt="" hidden>
                        </span>
                        <span class="profile-info hide-sm">
                            <span class="profile-name" id="topbar-username" data-i18n="shell.loading">Loading...</span>
                            <span class="role-badge" id="roleBadge" data-i18n="shell.guest">Guest</span>
                        </span>
                        <svg class="profile-chevron hide-sm" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"></path></svg>
                    </button>

                    <div class="profile-menu-panel" id="profileMenuPanel" hidden>
                        <div class="profile-menu-header">
                            <span class="profile-name" id="profileMenuName" data-i18n="shell.loading">Loading...</span>
                            <span class="role-badge" id="profileMenuRole" data-i18n="shell.guest">Guest</span>
                        </div>
                        <a href="#settings" class="profile-menu-item" data-profile-menu-nav="settings">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"></circle><path d="M20 21a8 8 0 0 0-16 0"></path></svg>
                            <span data-i18n="shell.profile">Profile Settings</span>
                        </a>
                        <button type="button" class="profile-menu-item" data-profile-menu-logout>
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><path d="m16 17 5-5-5-5"></path><path d="M21 12H9"></path></svg>
                            <span data-i18n="shell.logout">Logout</span>
                        </button>
                    </div>
                </div>
            </div>
        </header>

        <main id="page-content" class="p-6">
            <div class="empty-state" data-i18n="shell.loading">Loading...</div>
        </main>
    </div>
</div>

<script th:src="@{/js/core/api.js}"></script>
<script th:src="@{/js/core/i18n.js}"></script>
<script th:src="@{/js/core/weather-util.js}"></script>
<script th:src="@{/js/core/weather-widget.js}"></script>
<script th:src="@{/js/core/dashboard-view.js}"></script>
<script th:src="@{/js/core/dashboard-page.js}"></script>
<script th:src="@{/js/core/toast.js}"></script>
<script th:src="@{/js/core/loader.js}"></script>
<script th:src="@{/js/core/router.js}"></script>
<script th:src="@{/js/core/ai-widget.js}"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.6.1/sockjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
<script th:src="@{/js/core/chat-socket.js}"></script>
<script th:src="@{/js/dashboard.js}"></script>
</body>
</html>
