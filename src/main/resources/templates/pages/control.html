<section class="page dashboard-page" data-dashboard-view="CONTROL">
    <div class="dashboard-header">
        <div>
            <p class="section-eyebrow" data-i18n="ct.eyebrow">Control Center</p>
            <h1 class="section-title" data-i18n="ct.title">Platform control center</h1>
            <p class="text-muted" data-i18n="ct.sub">Governance, access and money movement across every region.</p>
        </div>
        <div class="dashboard-header-actions">
            <span class="badge badge-info" id="control-scope" hidden></span>
            <button type="button" class="btn btn-secondary btn-sm" data-control-csv data-i18n="page.exportCsv">Export CSV</button>
            <button type="button" class="btn btn-secondary btn-sm" data-control-refresh data-i18n="page.refresh">Refresh</button>
        </div>
    </div>

    <div class="dashboard-section" id="control-weather"></div>

    <section class="attention" id="control-attention" hidden aria-label="Needs your attention" data-i18n-aria="page.attention"></section>

    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 dashboard-card-grid" id="control-stats"></div>

    <div class="card dashboard-health" id="control-health-heading" hidden>
        <div id="control-health"></div>
    </div>

    <div class="section-heading" id="control-trends-heading" hidden>
        <h2 class="section-title" data-i18n="ct.trends">Platform trends</h2>
        <p class="section-subtitle" data-i18n="ct.trendsSub">Revenue, account growth and where the trade happens.</p>
    </div>
    <div class="grid grid-cols-1" id="control-charts"></div>

    <div class="section-heading" id="control-tables-heading" hidden>
        <h2 class="section-title" data-i18n="ct.tables">Governance tables</h2>
        <p class="section-subtitle" data-i18n="page.latest5">Latest 5 shown, View more opens the full page.</p>
    </div>
    <div class="grid grid-cols-1" id="control-tables"></div>

    <div class="section-heading">
        <h2 class="section-title" data-i18n="page.recentActivity">Recent activity</h2>
        <p class="section-subtitle" id="control-activity-count"></p>
    </div>
    <div class="card" id="control-activity"></div>
</section>
