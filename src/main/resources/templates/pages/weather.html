<style>
    /* District dropdown: dark background, crisp white text, readable option list */
    #weather-district-select,
    #overview-district-select {
        min-width: 13rem;
        padding: 0.6rem 2.2rem 0.6rem 0.9rem;
        background-color: #1e293b;
        color: #ffffff;
        border: 1px solid #475569;
        border-radius: 0.5rem;
        font-size: 0.95rem;
        line-height: 1.4;
        cursor: pointer;
        color-scheme: dark;
    }
    #weather-district-select option,
    #overview-district-select option {
        background-color: #1e293b;
        color: #ffffff;
        padding: 0.5rem 0.75rem;
    }
    #weather-district-select:focus,
    #overview-district-select:focus {
        outline: 2px solid #22c55e;
        outline-offset: 2px;
    }

    /* Live district search */
    .wx-search { position: relative; }
    .wx-search-input {
        min-width: 13rem;
        padding: 0.6rem 0.9rem;
        background-color: #1e293b;
        color: #ffffff;
        border: 1px solid #475569;
        border-radius: 0.5rem;
        font-size: 0.95rem;
        color-scheme: dark;
    }
    .wx-search-input::placeholder { color: #94a3b8; }
    .wx-search-input:focus { outline: 2px solid #22c55e; outline-offset: 2px; }
    .wx-search-results {
        position: absolute;
        top: calc(100% + 0.25rem);
        left: 0;
        right: 0;
        z-index: 30;
        max-height: 15rem;
        overflow-y: auto;
        margin: 0;
        padding: 0.25rem;
        list-style: none;
        background-color: #1e293b;
        border: 1px solid #475569;
        border-radius: 0.5rem;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
    }
    .wx-search-results[hidden] { display: none; }
    .wx-search-item, .wx-search-empty { padding: 0.5rem 0.75rem; border-radius: 0.375rem; color: #ffffff; }
    .wx-search-item { cursor: pointer; }
    .wx-search-item:hover, .wx-search-item.is-active { background-color: #334155; }
    .wx-search-empty { color: #94a3b8; }

    /* Refresh spinner */
    .wx-spinner {
        display: inline-block;
        width: 1rem;
        height: 1rem;
        margin-right: 0.5rem;
        vertical-align: -2px;
        border: 2px solid rgba(255, 255, 255, 0.35);
        border-top-color: #ffffff;
        border-radius: 50%;
        animation: wx-spin 0.7s linear infinite;
    }
    .wx-spinner[hidden] { display: none; }
    @keyframes wx-spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) {
        .wx-spinner { animation-duration: 2s; }
    }

    .weather-meta { font-size: 0.8rem; margin: 0.25rem 0 0.6rem; }
    .weather-advice { display: inline-block; }
    .weather-advice[hidden] { display: none; }
</style>

<section class="page" data-page="weather">
    <div class="flex flex-wrap items-center justify-between gap-4 mb-6">
        <div>
            <p class="section-eyebrow">Weather</p>
            <h1 class="section-title mb-1">District Weather Forecast</h1>
            <p class="text-muted mb-0">7-day forecast for your farming location</p>
        </div>
        <div class="flex flex-wrap items-center gap-3">
            <div class="wx-search" role="search">
                <label class="sr-only" for="weather-district-search">Search district</label>
                <input id="weather-district-search" type="search" class="wx-search-input"
                       placeholder="🔍 Search district…" autocomplete="off"
                       role="combobox" aria-expanded="false" aria-controls="weather-search-results"
                       aria-autocomplete="list">
                <ul id="weather-search-results" class="wx-search-results" role="listbox" hidden></ul>
            </div>
            <label class="sr-only" for="weather-district-select">District</label>
            <select id="weather-district-select" class="form-select" aria-label="District">
                <option value="">Loading districts…</option>
            </select>
            <button type="button" class="btn btn-primary" id="weather-refresh-btn">
                <span class="wx-spinner" hidden aria-hidden="true"></span>
                <span class="wx-refresh-label">Refresh</span>
            </button>
        </div>
    </div>

    <div id="weatherCurrent" class="card mb-4" aria-live="polite">
        <div class="empty-state" id="weatherLoading">Loading forecast...</div>
    </div>

    <div class="card">
        <div class="card-header">
            <h2 class="card-title">7-Day Outlook</h2>
            <span class="badge badge-info" id="weatherSummaryBadge">—</span>
        </div>
        <div id="weatherDaily" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mt-4">
            <div class="empty-state">No forecast data yet.</div>
        </div>
        <p class="text-muted mt-4 mb-0" style="font-size: 0.75rem;" id="weatherDisclaimer"></p>
    </div>

    <template id="weatherDailyTpl">
        <div class="stat-card">
            <div class="stat-card-head">
                <span class="stat-card-icon weather-day-icon">☀️</span>
                <span class="badge badge-info weather-day"></span>
            </div>
            <div class="stat-value weather-temp">--°C</div>
            <div class="text-muted weather-desc">--</div>
            <div class="text-muted weather-meta">--</div>
            <span class="badge weather-advice" hidden></span>
        </div>
    </template>
</section>
