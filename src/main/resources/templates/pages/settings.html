<section class="page">
    <div class="mb-6">
        <p class="section-eyebrow" data-i18n="set.eyebrow">Account</p>
        <h1 class="section-title mb-0" data-i18n="set.title">Settings</h1>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
        <div class="card">
            <div class="card-header">
                <h2 class="card-title" data-i18n="set.profile">Profile</h2>
            </div>

            <div class="avatar-uploader">
                <div class="avatar-preview" id="avatarPreview">
                    <span id="avatarInitials">?</span>
                    <img id="avatarImg" alt="Profile photo" hidden data-i18n-alt="set.photoAlt">
                    <label for="avatarFileInput" class="avatar-camera" role="button" tabindex="0" aria-label="Change profile photo" title="Change profile photo" data-i18n-aria="set.changePhoto" data-i18n-title="set.changePhoto">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path><circle cx="12" cy="13" r="4"></circle></svg>
                    </label>
                </div>
                <input type="file" id="avatarFileInput" accept="image/jpeg,image/png,image/webp" hidden>
                <p class="avatar-hint" data-i18n="set.photoHint">JPEG, PNG or WebP - max 5 MB</p>
            </div>

            <form id="profileForm" novalidate>
                <div class="field">
                    <label for="settingsName" data-i18n="set.name">Name</label>
                    <input id="settingsName" class="input" type="text" name="name" required>
                </div>
                <div class="field">
                    <label for="settingsEmail" data-i18n="set.email">Email</label>
                    <input id="settingsEmail" class="input" type="email" name="email" readonly disabled>
                </div>
                <div class="field">
                    <label for="settingsPhone" data-i18n="set.phone">Phone</label>
                    <input id="settingsPhone" class="input" type="tel" name="phone">
                </div>
                <div class="field">
                    <label for="settingsLocation" data-i18n="set.location">Location</label>
                    <input id="settingsLocation" class="input" type="text" name="location">
                </div>
                <button type="submit" class="btn btn-primary" data-i18n="set.save">Save Profile</button>
            </form>
        </div>

        <div class="card">
            <div class="card-header">
                <h2 class="card-title" data-i18n="set.changePw">Change Password</h2>
            </div>
            <form id="passwordForm" novalidate>
                <div class="field">
                    <label for="settingsCurrentPassword" data-i18n="set.currentPw">Current password</label>
                    <div class="password-input-wrap">
                        <input id="settingsCurrentPassword" class="input" type="password" name="currentPassword" required autocomplete="current-password">
                        <button type="button" class="password-toggle" data-toggle-password="settingsCurrentPassword" aria-label="Show password" aria-pressed="false">
                            <svg class="pw-icon pw-show" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                            <svg class="pw-icon pw-hide hidden" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"></path><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"></path><path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
                        </button>
                    </div>
                </div>
                <div class="field">
                    <label for="settingsNewPassword" data-i18n="set.newPw">New password</label>
                    <div class="password-input-wrap">
                        <input id="settingsNewPassword" class="input" type="password" name="newPassword" required minlength="8" autocomplete="new-password">
                        <button type="button" class="password-toggle" data-toggle-password="settingsNewPassword" aria-label="Show password" aria-pressed="false">
                            <svg class="pw-icon pw-show" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                            <svg class="pw-icon pw-hide hidden" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"></path><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"></path><path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
                        </button>
                    </div>
                    <p class="field-hint" data-i18n="set.pwHint">At least 8 characters including an uppercase letter, a lowercase letter and a number.</p>
                </div>
                <button type="submit" class="btn btn-primary" data-i18n="set.updatePw">Update Password</button>
            </form>
        </div>
    </div>
</section>
